included:
  - TMDB
  - TMDBTests
  - TMDBUITests
  - Packages

excluded:
  - "**/.build"
  - "**/DerivedData"
  - "demo_app"

analyzer_rules:
  - unused_declaration
  - unused_import

opt_in_rules:
  - array_init
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - discouraged_object_literal
  - empty_collection_literal
  - empty_count
  - empty_string
  - fatal_error_message
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - literal_expression_end_indentation
  - modifier_order
  - multiline_arguments
  - multiline_parameters
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_whitespace_closing_braces
  - yoda_condition

disabled_rules:
  - todo # sprint work legitimately leaves TODOs; tracked in docs/SPRINTS.md

trailing_comma:
  mandatory_comma: true # keep in sync with SwiftFormat --commas always

line_length:
  warning: 130
  error: 160
  ignores_comments: true
  ignores_urls: true

file_length:
  warning: 300
  error: 400

type_body_length:
  warning: 200
  error: 300

function_body_length:
  warning: 40
  error: 60

identifier_name:
  min_length: 2
  excluded: [x, y, z, id]

force_unwrapping:
  severity: error

custom_rules:
  no_print:
    name: "Avoid print"
    regex: '^\s*print\('
    message: "Use the CoreUtilities logger instead of print."
    severity: error
  no_combine:
    name: "No Combine"
    regex: '^\s*import Combine'
    message: "Combine is banned — use async/await and AsyncSequence."
    severity: error
  no_observable_object:
    name: "No ObservableObject"
    regex: '(ObservableObject|@Published|@StateObject|@EnvironmentObject)'
    message: "Use the Observation framework (@Observable/@Bindable) instead."
    severity: error
